# Desenvolvimento/local: frontend (nginx) em http://localhost:8080, API em http://localhost:8000.
# PostgreSQL entra na etapa de persistência (missões, checkpoints, relatórios).
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

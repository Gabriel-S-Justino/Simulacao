name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ma
          POSTGRES_PASSWORD: ma
          POSTGRES_DB: mission_architect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ma" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ma:ma@localhost:5432/mission_architect
      TEST_DATABASE_URL: postgresql://ma:ma@localhost:5432/mission_architect
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app
      - run: ruff format --check app
      - run: mypy app --exclude app/tests
      - name: Migrações (aplicar, conferir com os modelos e reverter)
        run: alembic upgrade head && alembic check && alembic downgrade base
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
